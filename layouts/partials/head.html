<!DOCTYPE html>
<html class="no-js"{{ partial "custom-html-attrs.html" . | safeHTMLAttr }}>
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <title>{{ .Title }} {{ if ne .Title .Site.Title }} &middot; {{ .Site.Title }}{{ end }}</title>
  {{ partial "favicon.html" }}
  {{ partial "base/metas.html" . }}
  {{ partial "base/imports.html" . }}
  {{ partial "custom-head.html" . }}
</head>
<body{{ with .Site.Params.theme }} class="{{ . }}"{{ end }} data-ng-app="myapp" data-ng-controller="MyController" data-ng-mouseleave="MouseLeave($event)">
    {{ partial "base/header.html" . }}
